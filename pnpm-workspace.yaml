packages:
    - 'apps/*'
    - 'packages/*'

# Keep the 24h quarantine enabled; allow only these exact releases selected for the dependency update.
minimumReleaseAgeExclude:
    - 'jose@6.2.15'
    - '@fastify/cors@11.4.0'
    - '@next/env@16.4.4'
    - '@next/swc-darwin-arm64@16.4.4'
    - '@next/swc-darwin-x64@16.4.4'
    - '@next/swc-linux-arm64-gnu@16.4.4'
    - '@next/swc-linux-arm64-musl@16.4.4'
    - '@next/swc-linux-x64-gnu@16.4.4'
    - '@next/swc-linux-x64-musl@16.4.4'
    - '@next/swc-win32-arm64-msvc@16.4.4'
    - '@next/swc-win32-x64-msvc@16.4.4'
    - fastify@5.12.8
    - next@16.4.4

# Only the reviewed esbuild installer may execute postinstall scripts.
allowBuilds:
    esbuild: true

# Limit the security override to Fastify static assets; glob 14 fixes the
# cancellation advisory and brings minimatch 11 for the traversal dependency.
overrides:
    '@fastify/static>glob': '^14.0.2'
