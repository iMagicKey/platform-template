name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm system:init
      - run: pnpm system:certs self-signed backend localhost
      - run: pnpm system:service install backend --user platform
      - run: pnpm check:architecture
      - name: Validate commit subject
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            pnpm check:commit "$(git log -1 --format=%B "$PR_HEAD_SHA")"
          else
            pnpm check:commit
          fi
      - run: pnpm test:system
      - run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Prettier diagnostics for centralized test migration
        run: |
          pnpm exec prettier --write .
          git diff --stat
          git diff -- tests/ docs/ARCHITECTURE.md README.md apps/ system/check.ts AGENTS.md
      - run: pnpm format:check
      - name: Integration smoke through real Caddy ingress
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y caddy
          sudo systemctl stop caddy || true
          caddy validate --config deploy/caddy/Caddyfile
          pnpm --filter @platform/web start >/tmp/platform-web.log 2>&1 &
          WEB_PID=$!
          pnpm --filter @platform/backend start >/tmp/platform-backend.log 2>&1 &
          BACKEND_PID=$!
          pnpm --filter @platform/api start >/tmp/platform-api.log 2>&1 &
          API_PID=$!
          caddy run --config deploy/caddy/Caddyfile >/tmp/platform-caddy.log 2>&1 &
          CADDY_PID=$!
          trap 'kill "$WEB_PID" "$BACKEND_PID" "$API_PID" "$CADDY_PID" 2>/dev/null || true' EXIT
          if ! pnpm system:smoke; then
            for log in /tmp/platform-{web,backend,api,caddy}.log; do
              echo "=== $log ==="
              tail -n 100 "$log"
            done
            exit 1
          fi
