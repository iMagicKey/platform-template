name: checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm system:init
      - run: pnpm system:certs self-signed backend localhost
      - run: pnpm system:service install backend
      - run: pnpm check:architecture
      - run: pnpm check:commit
      - run: pnpm test:system
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format
      - run: pnpm format:check
      - name: Normalize lockfile and sources
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: synchronize lockfile and source formatting"
          git push origin HEAD:main
