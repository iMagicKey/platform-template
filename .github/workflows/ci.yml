name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Regenerate dependency lockfile and normalize formatting once
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec prettier --write .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json apps packages system docs README.md .github eslint.config.mjs deploy
          if ! git diff --cached --quiet; then
            git commit -m "build(deps): synchronize resolved packages and formatting"
            git push origin HEAD:main
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm system:init
      - run: pnpm system:certs self-signed backend localhost
      - run: pnpm system:service install backend --user platform
      - run: pnpm check:architecture
      - run: pnpm check:commit
      - run: pnpm test:system
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check
      - name: Integration smoke through real Caddy ingress
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y caddy
          sudo systemctl stop caddy || true
          caddy validate --config deploy/caddy/Caddyfile
          pnpm --filter @platform/web start >/tmp/platform-web.log 2>&1 &
          WEB_PID=$!
          pnpm --filter @platform/backend start >/tmp/platform-backend.log 2>&1 &
          BACKEND_PID=$!
          pnpm --filter @platform/api start >/tmp/platform-api.log 2>&1 &
          API_PID=$!
          caddy run --config deploy/caddy/Caddyfile >/tmp/platform-caddy.log 2>&1 &
          CADDY_PID=$!
          trap 'kill "$WEB_PID" "$BACKEND_PID" "$API_PID" "$CADDY_PID" 2>/dev/null || true' EXIT
          if ! pnpm system:smoke; then
            for log in /tmp/platform-{web,backend,api,caddy}.log; do
              echo "=== $log ==="
              tail -n 100 "$log"
            done
            exit 1
          fi
