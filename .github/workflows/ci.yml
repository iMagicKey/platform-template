name: checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm system:init
      - run: pnpm system:certs self-signed backend localhost
      - run: pnpm system:service install backend
      - run: pnpm check:architecture
      - run: pnpm check:commit
      - run: pnpm test:system
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Normalize accepted Fastify refactor formatting once
        run: |
          pnpm exec prettier --write apps/backend/code apps/backend/tests/logging.test.ts apps/backend/AGENTS.md apps/api/code apps/api/tests/logging.test.ts apps/api/AGENTS.md docs/ARCHITECTURE.md
          if git diff --quiet -- apps/backend apps/api docs/ARCHITECTURE.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend apps/api docs/ARCHITECTURE.md
          git commit -m "style: normalize route and Fastify configuration formatting"
          git push origin HEAD:main
      - run: pnpm format:check
      - name: Integration smoke through real Caddy ingress
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y caddy
          sudo systemctl stop caddy || true
          caddy validate --config deploy/caddy/Caddyfile
          pnpm --filter @platform/web start >/tmp/platform-web.log 2>&1 &
          WEB_PID=$!
          pnpm --filter @platform/backend start >/tmp/platform-backend.log 2>&1 &
          BACKEND_PID=$!
          pnpm --filter @platform/api start >/tmp/platform-api.log 2>&1 &
          API_PID=$!
          caddy run --config deploy/caddy/Caddyfile >/tmp/platform-caddy.log 2>&1 &
          CADDY_PID=$!
          trap 'kill "$WEB_PID" "$BACKEND_PID" "$API_PID" "$CADDY_PID" 2>/dev/null || true' EXIT
          if ! pnpm system:smoke; then
            for log in /tmp/platform-{web,backend,api,caddy}.log; do
              echo "=== $log ==="
              tail -n 100 "$log"
            done
            exit 1
          fi
